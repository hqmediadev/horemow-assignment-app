name: Enterprise CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code from GitHub
        uses: actions/checkout@v4

      - name: Set up Clean Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      # Enterprise Practice: Writes directly to the file name required by Vite's configuration
      - name: Inject Production Firebase Credentials Securely
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let data = process.env.FIREBASE_SECRET_DATA;
            
            // Clean out hidden UTF-8 Byte Order Marks (\uFEFF) and whitespace padding
            const cleanJson = data.replace(/^\uFEFF/, '').trim();
            
            fs.writeFileSync('firebase-config.json', cleanJson, 'utf8');
        env:
          FIREBASE_SECRET_DATA: ${{ secrets.FIREBASE_CONFIG_JSON }}

      - name: Compile Pristine Production Build
        run: npm run build

      - name: Prune Dev Dependencies
        run: npm prune --omit=dev

      # Enterprise Practice: Deploy files to a safe user staging directory to bypass root permission blocks
      - name: Deploy Immutable Assets to VPS Staging Area
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "dist/,server.cjs,package.json,package-lock.json"
          target: "/home/ubuntu/horemow-staging"
          overwrite: true
          tar_tmp_path: "/tmp"

      - name: Move Assets to Production and Restart Services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # 1. Create target production directory if missing
            sudo mkdir -p /opt/horemow/app

            # 2. Safely sync staged assets into the production directory using sudo elevate privileges
            sudo cp -r /home/ubuntu/horemow-staging/dist /opt/horemow/app/
            sudo cp /home/ubuntu/horemow-staging/server.cjs /opt/horemow/app/
            sudo cp /home/ubuntu/horemow-staging/package.json /opt/horemow/app/
            sudo cp /home/ubuntu/horemow-staging/package-lock.json /opt/horemow/app/

            # 3. Clean up the staging area
            rm -rf /home/ubuntu/horemow-staging

            # 4. Install production dependencies safely inside target production space
            cd /opt/horemow/app
            sudo npm ci --omit=dev

            # 5. Lock down user ownership privileges back to the isolated system runner
            sudo chown -R horemow:horemow /opt/horemow

            # 6. Securely cycle the background service daemon
            sudo systemctl restart horemow
            sudo systemctl status horemow
