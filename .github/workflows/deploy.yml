name: Enterprise CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code from GitHub
        uses: actions/checkout@v4

      - name: Set up Clean Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      # Enterprise Practice: Writes directly to the file name required by Vite's configuration
      - name: Inject Production Firebase Credentials Securely
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let data = process.env.FIREBASE_SECRET_DATA;
            
            // Clean out hidden UTF-8 Byte Order Marks (\uFEFF) and whitespace padding
            const cleanJson = data.replace(/^\uFEFF/, '').trim();
            
                 - name: Deploy Immutable Assets to VPS via Secure SFTP
        uses: appleboy/sftp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/,server.cjs,package.json,package-lock.json"
          target: "/opt/horemow/app"
          overwrite: true

      - name: Deploy Immutable Assets to VPS via Secure Copy (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/,server.cjs,package.json,package-lock.json"
          target: "/opt/horemow/app"
          overwrite: true
          tar_tmp_path: "/tmp"

      - name: Restart Background Node Services via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # 1. Update dependencies inside production space
            cd /opt/horemow/app
            sudo npm ci --omit=dev

            # 2. Fix user ownership permissions for the isolated system runner
            sudo chown -R horemow:horemow /opt/horemow

            # 3. Securely cycle the background service daemon
            sudo systemctl restart horemow
            sudo systemctl status horemow
