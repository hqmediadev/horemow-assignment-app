name: Enterprise CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code from GitHub
        uses: actions/checkout@v4

      - name: Set up Clean Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Installs all framework components, including bun and fallback development dependencies
      - name: Install Project Dependencies
        run: npm install

      # Explicitly forces esbuild runner optimization parameters inside the runner container
      - name: Configure Esbuild Toolchain Binary
        run: npm install -D esbuild

      - name: Inject Production Firebase Credentials Securely
        run: |
          echo '${{ secrets.FIREBASE_CONFIG_JSON }}' > firebase-applet-config.json

      - name: Compile Pristine Production Build
        run: npm run build

      # Copies your 'dist/' folder AND your built backend 'server.cjs' and 'server.cjs.map' 
      - name: Deploy Immutable Assets to VPS via Secure Copy (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/*,server.cjs*"
          target: "/var/www/://horemow.com"
          strip_components: 1
          overwrite: true
          tar_tmp_path: "/tmp"

      - name: Restart Background Node Services via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/://horemow.com
            pm2 restart testimony --update-env || true
