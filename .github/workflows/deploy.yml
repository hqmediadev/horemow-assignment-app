name: Enterprise CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code from GitHub
        uses: actions/checkout@v4

      - name: Set up Clean Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm ci

      - name: Compile Pristine Production Build
        run: npm run build

      - name: Deploy Immutable Assets to VPS via Secure Copy (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist,server.cjs,server.cjs.map"
          target: "/var/www/da.horemow.com"
          overwrite: true
          tar_tmp_path: "/tmp"

      - name: Restart Background Node Services via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            export PATH=$PATH:/usr/bin:/usr/local/bin:/home/ubuntu/.npm-global/bin
            cd /var/www/da.horemow.com
            pm2 restart horemow-app || pm2 start server.cjs --name horemow-app
            curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/api/health
